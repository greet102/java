spring.application.name=springBootTest
spring.profiles.active=dev
#????????
logging.level.root=info
logging.level.com.fengling.springboot=warn
#??????????
logging.file.name=log/xx.log
#?????????
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
#??
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n

# ==================== 启动提速 ====================
# 懒加载：不用的 Bean 不初始化，显著加快启动
spring.main.lazy-initialization=true
# 关闭 JMX 监控（本地开发用不到）
spring.jmx.enabled=false

# ==================== MySQL 数据源 ====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ==================== MyBatis-Plus ====================
# 下划线转驼峰（post_like.post_id -> postId）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
